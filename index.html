<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PS4 Exploit Host by Darkoona</title>

    <link rel="stylesheet" href="style.css">

    <style>
        html {
            min-height: 100%;
            background-color: #111;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background-color: #111;

            background-image: url("./background.png") !important;
            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;

            color: white;
            font-family: Arial, sans-serif;
        }

        /* Main title */
        #msgs {
            text-align: center;
            margin: 0;
            padding: 10px;
            font-size: 26px;
            line-height: 1.4;
        }

        /* White separator */
        hr {
            border: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            margin: 20px 0 0;
        }

        /* Firmware menu directly below the title */
        #menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;

            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Select Your Firmware */
        .firmware-title {
            font-size: 18px;
            color: yellow;
            margin: 0 0 25px;
        }

        /* Multi FW button */
        .btn-multi {
            margin: 0 auto;
            cursor: pointer;
        }

        /* Footer */
        .footer-title {
            position: fixed;
            bottom: 10px;
            left: 0;
            right: 0;

            margin: 0;
            padding: 10px;

            font-size: 16px;
            text-align: center;
            line-height: 1.5;
            box-sizing: border-box;
        }

        .brand {
            color: #00bfff;
            margin-left: 5px;
            margin-right: 5px;
        }

        /* Mobile screens */
        @media (max-width: 600px) {
            #msgs {
                font-size: 22px;
            }

            .firmware-title {
                font-size: 18px;
                margin-bottom: 25px;
            }

            .footer-title {
                font-size: 14px;
                padding: 8px;
            }
        }
    </style>
</head>

<body>

    <h1 id="msgs">PS4 Exploit Host by Darkoona</h1>

    <hr>

    <div id="menu">

        <h1 class="firmware-title">
            Select Your Firmware
        </h1>

        <button
            class="btn btn-multi"
            onclick="location.href='g2all/index.html'"
            onmouseover="setMessage('PS4 GoldHEN Host for 5.05 and 7.00 to 13.52 FW - Auto Exploit Selection')"
            onmouseout="resetMessage()">

            GoldHEN Multi FW

        </button>

    </div>

    <h1 class="footer-title">
        Designed by:
        <span class="brand">Darkoona</span>
    </h1>

    <script>
        const defaultTitle = 'PS4 Exploit Host by Darkoona';
        const msgs = document.getElementById('msgs');

        function setMessage(message) {
            msgs.textContent = message;
        }

        function resetMessage() {
            msgs.textContent = defaultTitle;
        }
    </script>

</body>

</html>
