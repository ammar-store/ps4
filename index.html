
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PS4 Exploit Host by Ammar Store</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-image: url("Background.png");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        #msgs {
            text-align: center;
        }

        #menu, #crypto {
            text-align: center;
        }

        #crypto {
            display: none;
        }

        .btn-multi {
            margin: 5px;
        }

        .btn-onln {
            margin-top: 137px;
            margin-bottom: 77px;
            width: min(468px, 95%);
        }

        .brand {
            color: #f31414;
            margin-left: 10px;
            margin-right: 10px;
        }
    </style>
</head>

<body>

    <h1 id="msgs">PS4 Exploit Host by Ammar Store</h1>

    <hr>
    <br>

    <div id="menu">

        <h1 style="font-size: 18px; color: yellow;">
            Select Your Firmware
        </h1>

        <button
            class="btn btn-multi"
            onmouseover="setMessage('PS4 GoldHEN Host for 5.05 and 7.00 to 13.52 FW - Auto Exploit Selection')"
            onmouseout="resetMessage()"
            onclick="location.href='g2all/index.html'">
            GoldHEN Multi FW
        </button>

        <button
            class="btn"
            onmouseover="setMessage('PS4 5.05 FW Host v2.5')"
            onmouseout="resetMessage()"
            onclick="location.href='505/index.html'">
            5.05 FW v2.5
        </button>

        <a href="672goldhen/index.html">
            <button
                class="btn"
                onmouseover="setMessage('PS4 6.72 FW GoldHEN Host')"
                onmouseout="resetMessage()">
                6.72 FW GoldHEN
            </button>
        </a>

        <a href="672/index.html">
            <button
                class="btn"
                onmouseover="setMessage('PS4 6.72 FW Host v3.0')"
                onmouseout="resetMessage()">
                6.72 FW v3.0
            </button>
        </a>

        <br>

        <a href="900goldhen/index.html">
            <button
                class="btn"
                onmouseover="setMessage('PS4 9.00 FW GoldHEN Host - FontFaceSet Webkit')"
                onmouseout="resetMessage()">
                9.00 FW GoldHEN
            </button>
        </a>

        <a href="900v3/index.html">
            <button
                class="btn"
                onmouseover="setMessage('PS4 9.00 FW Host v3.0 - FontFaceSet Webkit')"
                onmouseout="resetMessage()">
                9.00 FW v3.0
            </button>
        </a>

        <br>

        <button
            class="btn"
            onmouseover="setMessage('Restore a Host to User Guide without using DNS')"
            onmouseout="resetMessage()"
            onclick="location.href='restore/index.html'">
            Restore Host
        </button>

        <br>

        <button
            class="btn btn-onln"
            onmouseover="setMessage('Support Ammar Store with a donation')"
            onmouseout="resetMessage()"
            onclick="donations()">
            For Donations (Only in Cryptocurrencies)
        </button>

        <h1 style="margin-top: 78px;">
            Designed by:
            <span class="brand">Ammar Store</span>
            A special thanks to all the devs on the scene.
        </h1>

    </div>

    <div id="crypto">

        <h1 style="font-size: 18px; color: yellow;">
            Donate with Bitcoin (BTC):
        </h1>

        <img src="btc.jpg" width="150" height="150" alt="Bitcoin QR Code">

        <br>

        <h1 style="font-size: 18px;">
            bc1q6cnsykmvem6zgw8wag3ygee0jkhtxj6rkp2nrm
        </h1>

        <br>

        <h1 style="font-size: 18px; color: yellow;">
            Donate with Ethereum (ETH):
        </h1>

        <img src="eth.jpg" width="150" height="150" alt="Ethereum QR Code">

        <h1 style="font-size: 18px;">
            0x7Ae1825ddE196925dB8B7832F436cA0eAeaF932c
        </h1>

        <button class="btn" onclick="load_menu()">
            Return
        </button>

    </div>

    <script>
        const defaultTitle = 'PS4 Exploit Host by Ammar Store';
        const msgs = document.getElementById('msgs');

        function setMessage(message) {
            msgs.textContent = message;
        }

        function resetMessage() {
            msgs.textContent = defaultTitle;
        }

        function donations() {
            document.getElementById('crypto').style.display = 'block';
            document.getElementById('menu').style.display = 'none';
        }

        function load_menu() {
            document.getElementById('menu').style.display = 'block';
            document.getElementById('crypto').style.display = 'none';
            resetMessage();
        }
    </script>

</body>
</html>
